<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#10130f">
<title>武林 · 血刃江湖</title>
<style>
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%;overflow:hidden;background:#0a0c0b;
    font-family:-apple-system,"PingFang SC","Noto Sans CJK SC",sans-serif;
    color:#eee;user-select:none;touch-action:none;overscroll-behavior:none}
  #stage{position:fixed;inset:0}
  #gl{display:block;width:100%;height:100%}

  /* ---------- HUD ---------- */
  #hud{position:fixed;inset:0;pointer-events:none;z-index:10}
  #hpWrap{position:absolute;left:16px;top:14px;width:min(46vw,220px)}
  .bar{height:7px;border-radius:4px;background:rgba(0,0,0,.5);overflow:hidden;margin-bottom:5px;
    box-shadow:inset 0 0 0 1px rgba(255,255,255,.14)}
  .bar>i{display:block;height:100%;width:100%;transition:width .12s linear}
  #hpFill{background:linear-gradient(90deg,#8d1f1f,#d64a3a)}
  #stFill{background:linear-gradient(90deg,#2f6b4a,#7fc9a0);height:100%}
  #stWrap{width:70%}
  #weaponBox{position:absolute;left:16px;top:56px;font-size:12px;letter-spacing:1px;
    color:#d8cfb8;text-shadow:0 1px 3px rgba(0,0,0,.9)}
  #weaponKind{opacity:.65;margin-right:6px}
  #weaponName{color:#f0dfae}

  #foeBar{position:absolute;left:50%;top:14px;transform:translateX(-50%);width:min(62vw,340px);
    opacity:0;transition:opacity .2s}
  #foeBar.show{opacity:1}
  #foeName{font-size:11px;text-align:center;color:#f0d7a8;text-shadow:0 1px 3px #000;margin-bottom:4px;letter-spacing:2px}
  #foeBreak{background:linear-gradient(90deg,#c99b2e,#ffe08a);width:0}
  #foeHp{background:linear-gradient(90deg,#7a2020,#e0553f)}

  #fps{position:absolute;right:12px;top:12px;font-size:10px;color:rgba(255,255,255,.45);font-variant-numeric:tabular-nums}

  /* ---------- 摇杆 ---------- */
  #stick{position:fixed;left:22px;bottom:26px;width:132px;height:132px;border-radius:50%;
    background:radial-gradient(circle,rgba(255,255,255,.09),rgba(255,255,255,.03));
    box-shadow:inset 0 0 0 1.5px rgba(255,255,255,.18);z-index:20;touch-action:none}
  #knob{position:absolute;left:50%;top:50%;width:58px;height:58px;margin:-29px 0 0 -29px;border-radius:50%;
    background:radial-gradient(circle at 35% 30%,rgba(255,240,210,.85),rgba(190,170,130,.5));
    box-shadow:0 2px 10px rgba(0,0,0,.6)}

  /* ---------- 按钮 ---------- */
  .btn{position:fixed;display:flex;align-items:center;justify-content:center;border-radius:50%;
    font-size:13px;font-weight:600;letter-spacing:1px;color:#f3e9d2;
    background:radial-gradient(circle at 38% 32%,rgba(70,66,58,.92),rgba(24,24,22,.86));
    box-shadow:inset 0 0 0 1.5px rgba(230,210,170,.28),0 3px 10px rgba(0,0,0,.5);
    z-index:20;touch-action:none;transition:transform .06s}
  .btn.on{transform:scale(.93);box-shadow:inset 0 0 0 2px rgba(255,220,150,.8)}
  #btnAtk{right:26px;bottom:34px;width:92px;height:92px;font-size:16px}
  #btnHeavy{right:126px;bottom:78px;width:66px;height:66px}
  #btnDodge{right:34px;bottom:138px;width:64px;height:64px}
  #btnBlock{right:124px;bottom:14px;width:64px;height:64px}
  #btnSwap{right:22px;bottom:214px;width:58px;height:58px;font-size:12px}
  #btnExec{right:206px;bottom:40px;width:62px;height:62px;font-size:12px;opacity:.45}
  #btnExec.ready{opacity:1;box-shadow:inset 0 0 0 2px #ffd166,0 0 16px rgba(255,209,102,.55)}
  #btnJam{right:206px;bottom:118px;width:52px;height:52px;font-size:12px;opacity:.5}
  #btnUse{right:206px;bottom:118px}

  /* ---------- 对话框 / 提示 ---------- */
  #toast{position:fixed;left:50%;top:19%;transform:translate(-50%,-6px);padding:9px 18px;
    background:rgba(12,14,12,.78);border:1px solid rgba(214,190,140,.35);border-radius:6px;
    font-size:13px;color:#f0e6cf;opacity:0;transition:all .25s;z-index:30;pointer-events:none;white-space:nowrap}
  #toast.show{opacity:1;transform:translate(-50%,0)}

  #dialog{position:fixed;left:50%;bottom:26%;transform:translateX(-50%) translateY(10px);
    width:min(88vw,520px);background:rgba(10,12,10,.9);border:1px solid rgba(200,175,120,.35);
    border-radius:10px;padding:14px 16px;z-index:40;opacity:0;pointer-events:none;transition:all .2s}
  #dialog.show{opacity:1;transform:translateX(-50%) translateY(0);pointer-events:auto}
  #dlgName{font-size:12px;color:#d9b46a;letter-spacing:2px;margin-bottom:6px}
  #dlgText{font-size:14px;line-height:1.65;color:#eee6d4}
  #dlgNext{margin-top:10px;text-align:right;font-size:13px;color:#c8b183}

  #err{position:fixed;left:10px;top:10px;z-index:99;display:none;max-width:80vw;
    background:rgba(120,20,20,.92);color:#fff;padding:8px 10px;border-radius:6px;font-size:12px;white-space:pre-wrap}
  #rotate{position:fixed;inset:0;z-index:95;display:none;flex-direction:column;
    align-items:center;justify-content:center;gap:10px;background:rgba(8,10,9,.96);text-align:center}
  #rotate.show{display:flex}
  .rotIcon{font-size:44px;color:#c8b183;animation:spin 3s linear infinite}
  @keyframes spin{to{transform:rotate(180deg)}}
  .rotTitle{font-size:20px;letter-spacing:6px;color:#f0e4c8}
  .rotSub{font-size:12px;line-height:1.9;color:#9d9madd;color:#9a9384}
  .rotBtn{margin-top:8px;padding:9px 20px;border:1px solid rgba(200,175,120,.5);
    border-radius:999px;font-size:13px;color:#d9c69a}
  #hint{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;
    background:#0a0c0b;color:#c8b183;font-size:13px;letter-spacing:3px;z-index:90}
</style>
</head>
<body>
<div id="stage"><canvas id="gl"></canvas></div>

<div id="hud">
  <div id="hpWrap">
    <div class="bar"><i id="hpFill"></i></div>
    <div class="bar" id="stWrap"><i id="stFill"></i></div>
    <div id="weaponBox"><span id="weaponKind"></span><span id="weaponName"></span></div>
  </div>
  <div id="foeBar">
    <div id="foeName"></div>
    <div class="bar"><i id="foeHp"></i></div>
    <div class="bar" style="height:4px"><i id="foeBreak"></i></div>
  </div>
  <div id="fps"></div>
</div>

<div id="stick"><div id="knob"></div></div>
<div class="btn" id="btnAtk">斩</div>
<div class="btn" id="btnHeavy">重</div>
<div class="btn" id="btnDodge">闪</div>
<div class="btn" id="btnBlock">御</div>
<div class="btn" id="btnSwap">换兵</div>
<div class="btn" id="btnExec">处决</div>
<div class="btn" id="btnJam">跳</div>

<div id="toast"></div>
<div id="dialog">
  <div id="dlgName"></div>
  <div id="dlgText"></div>
  <div id="dlgNext">继续 ›</div>
</div>
<div id="err"></div>
<div id="hint">江湖初入……</div>
<div id="rotate">
  <div class="rotIcon">⟳</div>
  <div class="rotTitle">请横屏游玩</div>
  <div class="rotSub">《武林 · 血刃江湖》为横屏 3D 游戏<br>把手机转横可获得完整视野</div>
  <div class="rotBtn" id="rotGo">仍然竖屏进入</div>
</div>

<script src="js/three.min.js"></script>
<script src="js/textures.js?v=64"></script>
<script src="js/core.js?v=64"></script>
<script src="js/terrain.js?v=64"></script>
<script src="js/arch.js?v=64"></script>
<script src="js/town.js?v=64"></script>
<script src="js/hero.js?v=64"></script>
<script src="js/fx.js?v=64"></script>
<script src="js/combat.js?v=64"></script>
<script src="js/foe.js?v=64"></script>
<script src="js/ui.js?v=64"></script>
<script src="js/merge.js?v=64"></script>
<script src="js/game.js?v=64"></script>
<script>
document.getElementById('rotGo').addEventListener('click', function(){ window.__forcePortrait && window.__forcePortrait(); });
</script>
</body>
</html>
